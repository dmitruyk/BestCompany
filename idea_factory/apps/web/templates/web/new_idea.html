{% extends "base.html" %}

{% block title %}New Idea Request - Idea Factory{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">New Idea Request</h1>

    {% if provider_error %}
    <div class="mb-6 p-4 rounded-lg bg-amber-50 border border-amber-200 text-amber-800">
        <p class="font-medium">Provider configuration error</p>
        <p class="text-sm mt-1">{{ provider_error }}</p>
    </div>
    {% endif %}

    {% if error %}
    <div class="mb-6 p-4 rounded-lg bg-red-50 border border-red-200 text-red-800">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="{% url 'new_idea' %}" class="space-y-6 bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        {% csrf_token %}
        <div>
            <label for="title" class="block text-sm font-medium text-slate-700 mb-1">Title</label>
            <input type="text" name="title" id="title" maxlength="255" placeholder="e.g. SaaS for local bakeries"
                class="w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                value="{{ request.POST.title|default:'' }}">
        </div>
        <div>
            <label for="prompt" class="block text-sm font-medium text-slate-700 mb-1">Prompt <span class="text-red-500">*</span></label>
            <textarea name="prompt" id="prompt" rows="6" required placeholder="Describe your business idea request, constraints, target market, etc."
                class="w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">{{ request.POST.prompt|default:'' }}</textarea>
        </div>
        <div>
            <label for="provider" class="block text-sm font-medium text-slate-700 mb-1">LLM Provider</label>
            <select name="provider" id="provider" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                {% for value, label in providers %}
                <option value="{{ value }}" {% if request.POST.provider == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="model_id" class="block text-sm font-medium text-slate-700 mb-1">Model (Ollama, tool-capable)</label>
            <select name="model_id" id="model_id" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                <option value="">Use default (gpt-oss:20b)</option>
                {% for value, label in ollama_models %}
                <option value="{{ value }}" {% if request.POST.model_id == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="flex gap-4">
            <button type="submit" class="inline-flex items-center px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 disabled:opacity-50" {% if provider_error %}disabled{% endif %}>
                Run Now
            </button>
            <a href="{% url 'home' %}" class="inline-flex items-center px-4 py-2 rounded-lg border border-slate-300 text-slate-700 text-sm font-medium hover:bg-slate-50">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
