{% extends "base.html" %}

{% block title %}Start Discussion - {{ company.name }}{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'company_detail' pk=company.pk %}" class="text-sm text-indigo-600 hover:text-indigo-800">← {{ company.name }}</a>
    <h1 class="text-xl font-bold text-slate-900 mt-1">Start Director Discussion</h1>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 max-w-lg">
    <p class="text-slate-600 mb-4">Directors will discuss the topic and propose concrete actions for you to select.</p>
    <form method="post">
        {% csrf_token %}
        <label for="topic" class="block text-sm font-medium text-slate-700 mb-2">Topic</label>
        <input type="text" id="topic" name="topic" value="Next steps"
            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            placeholder="e.g. Next steps, Marketing launch, Budget review">
        <button type="submit" class="mt-4 inline-flex items-center px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
            Start Discussion
        </button>
    </form>
</div>
{% endblock %}
