{% extends "base.html" %}

{% block title %}Schedule Action - {{ company.name }}{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'director_discussion_detail' company_pk=company.pk discussion_pk=action.discussion_id %}" class="text-sm text-indigo-600 hover:text-indigo-800">← Back to discussion</a>
    <h1 class="text-xl font-bold text-slate-900 mt-1">Schedule: {{ action.action_type }}</h1>
</div>

<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 max-w-md">
    <p class="text-slate-600 mb-4">{{ action.description }}</p>
    <form method="post">
        {% csrf_token %}
        <label for="action_date" class="block text-sm font-medium text-slate-700 mb-2">Date</label>
        <input type="date" id="action_date" name="action_date" value="{{ today }}"
            min="{{ min_date }}"
            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            required>
        <button type="submit" class="mt-4 inline-flex items-center px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
            Add to Calendar
        </button>
    </form>
</div>
{% endblock %}
