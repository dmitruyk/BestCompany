[project]
name = "idea-factory"
version = "0.1.0"
description = "Business Idea Factory - Multi-agent pipeline for idea generation and validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2,<6",
    "strands-agents[ollama,openai]>=1.0.0",
    "pydantic>=2.0",
    "duckduckgo-search>=4.0; extra == 'search'",
    "requests>=2.28",
]

[project.optional-dependencies]
search = ["duckduckgo-search>=4.0"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-django>=4.5",
]
