# Config is baked into the image from local .env at build time (make build-push-docker).
# Optional: uncomment env_file to override without rebuilding.
#   env_file:
#     - .env

services:
  idea-factory:
    image: ${REGISTRY_IMAGE:-192.168.0.230:5005/idea-factory:latest}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - idea-factory-media:/app/media
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Background ticker: activity checks, autonomous loop, Monday weekly planning.
  idea-factory-ticker:
    image: ${REGISTRY_IMAGE:-192.168.0.230:5005/idea-factory:latest}
    entrypoint: ["./docker-entrypoint-ticker.sh"]
    command:
      ["python", "manage.py", "run_company_ticker", "--loop"]
    volumes:
      - idea-factory-media:/app/media
    restart: unless-stopped
    depends_on:
      idea-factory:
        condition: service_healthy

volumes:
  idea-factory-media:
