# Config is baked into the image from local .env at build time (make build-push-docker).
# Optional: uncomment env_file to override without rebuilding.
#   env_file:
#     - .env

services:
  idea-factory:
    image: ${REGISTRY_IMAGE:-192.168.0.230:5005/idea-factory:latest}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - idea-factory-media:/app/media
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  idea-factory-media:
